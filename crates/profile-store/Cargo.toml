[package]
name = "profile-store"
version = "0.0.1"
edition.workspace = true

[dependencies]
age = "0.12.1"
# デフォルトでは鍵をdrop時にzeroizeしないため、zeroize featureを明示的に有効化する。
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
dirs = "7.0.0"
masking-core = { version = "0.0.1", path = "../masking-core" }
# chacha20poly1305が内部で使うpoly1305はzeroize featureが転送されないため、
# transitive依存に直接featureを立てて、MAC計算の中間状態もdrop時に消去させる。
poly1305 = { version = "0.9", features = ["zeroize"] }
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
# バルクの平文JSON(プロファイル全体)をメモリ上に残さないため。secrecy経由で既に
# 依存グラフに含まれているバージョンと合わせる。
zeroize = "1"

[dev-dependencies]
tempfile = "3.27.0"
