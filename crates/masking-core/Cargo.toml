[package]
name = "masking-core"
version = "0.0.4"
edition.workspace = true

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
# ルールの内容(パターン・固定値など)を、メモリから消去できるようにするため(型に、Zeroizeを実装する)。
zeroize = "1"

[dev-dependencies]
serde_json = "1.0.151"
# 消去したメモリが、解放される前に、実際に上書きされているかを確かめるため(テスト専用)。
wipe-check = { path = "../wipe-check" }
