[package]
name = "gui"
version = "0.0.1"
description = "A Tauri App"
authors = ["you"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# with_webview経由でwebview2-comの型を直接使うため、tauriの内部依存とのバージョン
# 不一致を避けるべくマイナーバージョンまで固定する(Tauri公式の推奨)。
tauri = { version = "2.11", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
masking-core = { version = "0.0.1", path = "../../crates/masking-core" }
profile-store = { version = "0.0.1", path = "../../crates/profile-store" }
# e2e-testing feature専用。認証無しのWebDriverプロトコルサーバーを起動する実装のため、
# 配布用ビルドに絶対に含めない(optional依存にしてデフォルトのコンパイル対象から外す)。
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
tauri-plugin-dialog = "2.7.3"
# クリップボードの書き込み/読み取り/クリアをRust側で行うための公式プラグイン。
# navigator.clipboard.readText()と異なりウィンドウのフォーカスやWeb権限プロンプトに
# 依存しない。読み取り/クリア、および非Windows環境での書き込みはこちらを経由する。
tauri-plugin-clipboard-manager = "2"
# Windows環境での書き込み時にSetExtWindows(exclude_from_history/exclude_from_cloud)で
# クリップボード履歴・クラウド同期からの除外を行うために直接依存する。
# tauri-plugin-clipboard-manager 2.3.3が解決するバージョンと合わせ、重複を避ける。
arboard = "3.6.1"
# トレイメニューの「クリップボードをマスク」失敗時にOS通知を出すための公式プラグイン。
tauri-plugin-notification = "2"
# トレイメニューの「自動起動」チェックボックス項目用の公式プラグイン。
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
# WebView2既定のブラウザアクセラレータキー(Ctrl+F/F3等)を無効化するために直接使う。
# tauriが内部で使うバージョンと型を一致させる必要があるため、tauriのバージョン固定と
# 合わせてここも更新する。
webview2-com = "0.38"
windows-core = "0.61"

[features]
# 依存自体をデフォルトから外すためのfeature。有効化してもlib.rs側でさらに
# debug_assertionsも要求するため、release buildでは万一指定されても無効化される。
e2e-testing = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3.27.0"
