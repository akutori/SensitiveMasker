[package]
name = "gui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
masking-core = { version = "0.1.0", path = "../../crates/masking-core" }
profile-store = { version = "0.1.0", path = "../../crates/profile-store" }
# e2e-testing feature専用。認証無しのWebDriverプロトコルサーバーを起動する実装のため、
# 配布用ビルドに絶対に含めない(optional依存にしてデフォルトのコンパイル対象から外す)。
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
tauri-plugin-dialog = "2.7.3"

[features]
# 依存自体をデフォルトから外すためのfeature。有効化してもlib.rs側でさらに
# debug_assertionsも要求するため、release buildでは万一指定されても無効化される。
e2e-testing = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3.27.0"
