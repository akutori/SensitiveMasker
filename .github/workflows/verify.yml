name: Verify

# リリース前の検証。release.ymlから呼ばれ(失敗するとリリースは公開されない)、
# タグを打つ前に確かめられるよう、手動でも実行できる。

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      # src・E2E・scripts・vite.config.ts・wdio.conf.tsの型を検査する(下のbun run buildのtscは、srcだけを検査する)。
      - name: type check (src, e2e, scripts, config)
        working-directory: gui
        run: bun run typecheck

      # 配布用と同じ設定(VITE_E2E_TESTINGなし)でビルドする。型検査も兼ねる。
      # gui/src-tauriのコンパイル(cargo test)は、ビルド済みのdistが存在することを要求するため、
      # Rustのテストより前に行う。
      - name: build frontend
        working-directory: gui
        run: bun run build

      - name: check the frontend build (no E2E-only code, patched DOMPurify)
        working-directory: gui
        run: bun run check:dist

      - name: frontend unit tests
        working-directory: gui
        run: bun run test:unit

      - name: install Chromium for Storybook tests
        working-directory: gui
        run: bunx playwright install --with-deps chromium

      - name: Storybook play tests
        working-directory: gui
        run: bun run test:stories

      # Cargo.lockのとおりに解決できることも確かめる(--locked)。
      - name: Rust tests
        run: cargo test --workspace --locked

  # Windows・macOSでも、Rustのテストを通す(そのOSでだけ動くテスト、Windowsのデバッグビルドでだけ動く
  # tauri::testのテスト、macOSでのUnix向けの処理を含む)。フロントエンドの検査は、上のjob(Ubuntu)で行う。
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      # gui/src-tauriのコンパイルは、ビルド済みのdistが存在することを要求するため、Rustのテストより前に行う。
      - name: build frontend
        working-directory: gui
        run: bun run build

      - name: Rust tests
        run: cargo test --workspace --locked
