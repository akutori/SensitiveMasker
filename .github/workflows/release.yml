name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            cli-suffix: 'macos-arm64'
          - platform: 'ubuntu-22.04'
            args: ''
            rust-targets: ''
            cli-suffix: 'linux-x86_64'
          - platform: 'windows-latest'
            args: ''
            rust-targets: ''
            cli-suffix: 'windows-x86_64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        working-directory: gui
        run: bun install

      - name: build masker / masker-mcp
        run: cargo build --release -p masker -p masker-mcp

      - name: package CLI binaries
        shell: bash
        run: |
          mkdir -p dist-cli
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/release/masker.exe "dist-cli/masker-${{ matrix.cli-suffix }}.exe"
            cp target/release/masker-mcp.exe "dist-cli/masker-mcp-${{ matrix.cli-suffix }}.exe"
          else
            cp target/release/masker "dist-cli/masker-${{ matrix.cli-suffix }}"
            cp target/release/masker-mcp "dist-cli/masker-mcp-${{ matrix.cli-suffix }}"
          fi

      - name: build & publish GUI (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          tagName: ${{ github.ref_name }}
          releaseName: 'SensitiveMasker ${{ github.ref_name }}'
          releaseBody: 'このタグに対応するインストーラー・実行ファイルは下記アセットからダウンロードしてください。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: upload CLI binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-cli/*
